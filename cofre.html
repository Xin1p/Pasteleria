<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cofre del corazón — Para Dana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Assets/dana.css">
</head>
<body class="theme-cofre">
    <nav class="dana-nav">
        <a href="index.html" class="dana-logo">Para Dana</a>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="recuerdos.html">Recuerdos</a></li>
            <li><a href="sorpresas.html">Sorpresas</a></li>
            <li><a href="loquebrilla.html">Lo que brilla</a></li>
            <li><a href="carta.html">Carta</a></li>
            <li><a href="cofre.html" class="dana-cofre activo">♥ Cofre <span id="carrito-contador"></span></a></li>
        </ul>
    </nav>

    <main class="contenedor">
        <h1 class="titulo-pagina">Cofre del corazón</h1>
        <p class="subtitulo-pagina">Todo lo que guardaste desde las otras páginas</p>

        <div id="carrito-lista"></div>

        <div id="carrito-resumen" class="cofre-acciones" style="display: none;">
            <button type="button" class="btn-cofre btn-cofre-primario" id="btn-mensaje-final">
                Ver todo junto
            </button>
            <button type="button" class="btn-cofre btn-cofre-secundario" id="btn-limpiar-carrito" onclick="limpiarCarrito()">
                Vaciar cofre
            </button>
        </div>
    </main>

    <footer class="pie-dana">Tema: cofre del tesoro</footer>
    <script src="Assets/cofre.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            renderizarCarrito();
            document.getElementById('btn-mensaje-final').addEventListener('click', function () {
                const items = carrito.obtenerItems();
                if (items.length === 0) {
                    alert('El cofre está vacío. Guarda algo desde las otras páginas.');
                    return;
                }
                const lista = items.map((i) => '• ' + i.nombre + ': ' + (i.nota || '')).join('\n');
                alert('Dana, guardé esto para ti:\n\n' + lista + '\n\nCada cosa es un pedacito de lo que siento. ♥');
            });
        });
    </script>
</body>
</html>
